name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -p tsconfig.json --noEmit

      - name: Test
        run: bunx vitest run

      - name: Committed dist is up to date
        run: |
          bun run build
          git add -A dist
          if ! git diff --cached --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --cached --stat -- dist
            exit 1
          fi
          echo "dist/ matches a fresh build."
